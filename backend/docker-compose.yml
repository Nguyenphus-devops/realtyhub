version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: al_demo_dongtayland_click:api
    container_name: al_demo_dongtayland_click_api
    ports:
      - "8827:8827"
    env_file:
      - .env
    environment:
      - PORT=8827
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:8827/', (r) => {if (r.statusCode !== 200) throw new Error()})\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
